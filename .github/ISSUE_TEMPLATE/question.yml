name: 一般问题 / General question
description: 使用方式、配置、兼容性、排查思路 / Usage, configuration, compatibility, or troubleshooting
title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请阅读 [README](https://github.com/bob-zebedy/CodexBar#readme)，并搜索[现有 Issue](https://github.com/bob-zebedy/CodexBar/issues)

        Before asking, check the [README](https://github.com/bob-zebedy/CodexBar#readme) and [existing issues](https://github.com/bob-zebedy/CodexBar/issues)

  - type: textarea
    id: question
    attributes:
      label: 问题 / Question
      description: |
        写下你想咨询的问题。

        Describe what you would like to know.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 相关背景 / Background
      description: |
        说明你正在做什么、观察到什么，以及已经尝试过的操作。

        Explain what you are trying to do, what you have observed, and what you have already tried.
    validations:
      required: false

  - type: input
    id: codexbar-version
    attributes:
      label: CodexBar 版本 / CodexBar version
      description: |
        右键点击菜单栏中的 CodexBar 图标，在“设置 → 关于”中查看。

        Right-click the CodexBar menu bar icon → Settings → About tab.
    validations:
      required: false

  - type: input
    id: macos-version
    attributes:
      label: macOS 版本 / macOS version
      description: |
        在“Apple 系统设置 → 通用 → 关于本机”中查看。

        Find it in System Settings → General → About.
    validations:
      required: false

  - type: input
    id: codex-environment
    attributes:
      label: Codex 来源 / Codex source
      placeholder: Codex App / Codex CLI / VS Code extension / App + CLI
    validations:
      required: false

  - type: input
    id: codex-cli-version
    attributes:
      label: Codex CLI 版本 / Codex CLI version
      description: |
        右键点击菜单栏中的 CodexBar 图标，在“设置 → 关于”中查看，或在终端运行 `codex --version`

        Right-click the CodexBar menu bar icon → Settings → About tab. You can also run `codex --version` in Terminal.
    validations:
      required: false

  - type: input
    id: codex-app-version
    attributes:
      label: Codex App 版本 / Codex App version
      description: |
        在 CodexBar 的“设置 → 关于”或 Codex App 中查看。

        Right-click the CodexBar menu bar icon → Settings → About tab, or check Codex App.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 截图、日志、补充信息 / Screenshots, logs, and additional information
      description: |
        可附截图、录屏、相关日志或 IDE 扩展版本（请隐藏凭证和个人信息等敏感数据）。

        Add screenshots, recordings, relevant logs, or the IDE extension version (redact sensitive data, such as credentials and personal information).
    validations:
      required: false
