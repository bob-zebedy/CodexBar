included:
    - CodexBar

line_length:
    warning: 180
    error: 220
    ignores_comments: true
    ignores_urls: true
    ignores_function_declarations: true
    ignores_interpolated_strings: true

# 这两项放宽只为容纳 StatusItemController: 它是文件级 private 类, 拆到别的文件写 extension
# 就得把类和存储属性从 private 放宽到 internal, 为消一条 warning 暴露实现细节不划算
# 余量只留了 4% 左右, 继续变长仍会报; 新文件不要向这个上限看齐
file_length:
    warning: 1300
    error: 1500
    ignore_comment_only_lines: true

type_body_length:
    warning: 1200
    error: 1400

function_body_length:
    warning: 80
    error: 120

function_parameter_count:
    warning: 7
    error: 9

cyclomatic_complexity:
    warning: 15
    error: 25
    ignores_case_statements: true

identifier_name:
    min_length:
        warning: 1
    max_length:
        warning: 60
        error: 80
